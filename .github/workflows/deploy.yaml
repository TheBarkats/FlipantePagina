name: Deploy to SiteGround - FlipantePagina

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular project
        run: npm run build

      - name: Deploy to SiteGround
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PORT: ${{ secrets.PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > private_key
          chmod 600 private_key
          if ! ssh-keygen -y -f private_key > /dev/null; then
            echo "Invalid SSH_PRIVATE_KEY secret format." >&2
            exit 1
          fi

          rsync -avz --delete --dry-run \
          -e "ssh -i private_key -o StrictHostKeyChecking=no -p $PORT" \
          dist/pagina/browser/ $USER@$HOST:$REMOTE_PATH
