name: Deploy to SiteGround - FlipantePagina

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Restore SSH Key
        run: |
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > private_key
          chmod 600 private_key

          echo "Validando clave SSH..."
          ssh-keygen -y -f private_key > /dev/null

        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}

      - name: Deploy to SiteGround
        run: |
          rsync -avz --delete \
            -e "ssh -i private_key -o StrictHostKeyChecking=no -p $PORT" \
            dist/pagina/browser/ \
            $USER@$HOST:$REMOTE_PATH

        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PORT: ${{ secrets.PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
